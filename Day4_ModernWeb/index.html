<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
<header><div class="container nav"><h1>DMCE EventHub</h1><div><button id="themeBtn">Toggle Theme</button><a href="#planner">Planner</a></div></div></header>

<section class="alt section"><div class="container"><h2>My Saved Plan</h2><div id="savedPlan"></div></div></section>

<footer><p>© 2026 DMCE EventHub | Day 4 Modern Web Demo</p></footer>
